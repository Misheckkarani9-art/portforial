<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable | Portfolio</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="images/logo.png">


<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background: radial-gradient(circle at top, #0b0b0f, #050508);
  color:#fff;
}

/* NAVBAR (same style as projects) */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 50px;
  background:rgba(10,10,15,0.65);
  backdrop-filter: blur(18px);
  border-bottom:1px solid rgba(212,175,55,0.2);
}

.logo{
  font-size:22px;
  font-weight:700;
}

.logo span{
  color:#d4af37;
}

.nav-links{
  display:flex;
  gap:15px;
}

.nav-links a{
  color:#cbd5e1;
  text-decoration:none;
  padding:8px 12px;
  border-radius:10px;
}

.nav-links a.active,
.nav-links a:hover{
  color:#d4af37;
  background:rgba(212,175,55,0.12);
  border:1px solid rgba(212,175,55,0.3);
}

/* TOP BUTTONS */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:20px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  background:#d4af37;
  color:black;
}

/* SLIDE PANEL */
.panel{
  max-height:0;
  overflow:hidden;
  transition:0.5s ease;
  background:rgba(255,255,255,0.03);
  border-top:1px solid rgba(212,175,55,0.15);
}

.panel.open{
  max-height:400px;
  padding:20px;
}

textarea{
  width:100%;
  height:140px;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(212,175,55,0.2);
  background:rgba(255,255,255,0.03);
  color:white;
  outline:none;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:22px;
  padding:30px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(212,175,55,0.12);
  border-radius:18px;
  padding:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#d4af37;
}

.title{
  color:#d4af37;
  font-size:16px;
  font-weight:700;
}

.time{
  margin-top:8px;
  color:#cbd5e1;
}

.note{
  margin-top:10px;
  font-size:13px;
  color:#aab3c5;
}

.delete{
  margin-top:12px;
  width:100%;
  background:red;
  color:white;
}
/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  margin-top:20px;
  border-top:1px solid rgba(212,175,55,0.15);
  color:#777;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">My<span>Portfolio</span></div>

  <div class="nav-links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="profile.html">Profile</a>
    <a href="about.html">About</a>
    <a class="active" href="timetable.html">Timetable</a>
  </div>
</div>

<!-- BUTTONS -->
<div class="topbar">
  <button onclick="togglePanel()">➕ Add Timetable (JSON)</button>
  <button onclick="clearAll()" style="background:red;color:white;">🗑 Clear All</button>
</div>

<!-- SLIDE PANEL -->
<div id="panel" class="panel">
  <textarea id="jsonInput" placeholder='
[
  {
    "title":"Gym",
    "time":"6:00 - 7:00 AM",
    "note":"Chest workout"
  }
]
'></textarea>

  <button onclick="addJSON()" style="width:100%;margin-top:10px;">
    Import Timetable
  </button>
</div>

<!-- GRID -->
<div id="grid" class="grid"></div>

<!-- FOOTER -->
<div class="footer">
  © 2026 MyPortfolio | Built with passion and consistency | by Misheckkarani
</div>

<script>

function getData(){
  return JSON.parse(localStorage.getItem("timetable")) || [];
}

function saveData(data){
  localStorage.setItem("timetable", JSON.stringify(data));
}

/* TOGGLE */
function togglePanel(){
  document.getElementById("panel").classList.toggle("open");
}

/* ADD JSON */
function addJSON(){
  const input = document.getElementById("jsonInput").value;

  try{
    const newItems = JSON.parse(input);

    if(!Array.isArray(newItems)){
      alert("Must be an array!");
      return;
    }

    let data = getData();
    data = [...data, ...newItems];

    saveData(data);
    render();

    document.getElementById("jsonInput").value = "";
    togglePanel();

  }catch(e){
    alert("Invalid JSON!");
  }
}

/* DELETE */
function remove(i){
  let data = getData();
  data.splice(i,1);
  saveData(data);
  render();
}

/* CLEAR */
function clearAll(){
  localStorage.removeItem("timetable");
  render();
}

/* RENDER */
function render(){
  const grid = document.getElementById("grid");
  const data = getData();

  grid.innerHTML = "";

  if(data.length === 0){
    grid.innerHTML = "<p style='padding:30px;color:#aaa;'>No timetable yet 🚀</p>";
    return;
  }

  data.forEach((item,i)=>{
    grid.innerHTML += `
      <div class="card">
        <div class="title">${item.title}</div>
        <div class="time">⏰ ${item.time}</div>
        <div class="note">📝 ${item.note || "-"}</div>
        <button class="delete" onclick="remove(${i})">Delete</button>
      </div>
    `;
  });
}

render();

</script>

</body>
</html>
